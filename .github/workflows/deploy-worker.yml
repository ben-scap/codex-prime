name: Manual Cloudflare Worker deployment

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Required tests before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Reject non-production dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Le déploiement du Worker est autorisé uniquement depuis main."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Verify Worker paths and lockfile
        working-directory: worker
        run: |
          test -f src/index.js
          test -f wrangler.jsonc
          test -f package.json
          test -f package-lock.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          if (pkg.name !== "codex-prime-api" || lock.name !== pkg.name) throw new Error("package.json/package-lock.json incohérents");
          if (lock.lockfileVersion !== 3) throw new Error("lockfileVersion 3 attendu");
          if (config.main !== "src/index.js" || config.name !== "codex-prime-api") throw new Error("Configuration Wrangler invalide");
          console.log("Chemins, package-lock.json et configuration Wrangler vérifiés.");
          NODE
          node --check src/index.js

      - name: Install locked dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply projet-db --remote
          workingDirectory: worker
          wranglerVersion: "4.45.0"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: worker
          wranglerVersion: "4.45.0"
