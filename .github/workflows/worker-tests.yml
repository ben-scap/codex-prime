name: Worker tests
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker
        working-directory: worker
        run: npm test
